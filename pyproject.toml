[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "educational-content-summarizer"
version = "0.1.0"
description = "NLP-based educational content summarization system (college mini-project)."
authors = [
    { name = "Swapnil Santosh Akhade" },
    { name = "Bansude Sudarshan Sakharam" },
]
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
