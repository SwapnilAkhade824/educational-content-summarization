name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download NLTK resources
        run: |
          python -c "import nltk; [nltk.download(d, quiet=True) for d in ['punkt','punkt_tab','stopwords','wordnet','omw-1.4','vader_lexicon','averaged_perceptron_tagger','averaged_perceptron_tagger_eng']]"
      - name: Run tests
        run: python -m pytest -q
